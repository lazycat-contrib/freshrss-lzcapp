version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/freshrss.lpk
  target_arch: amd64
update:
  strategy: publish
  sync_license: true
  allow_downgrade: false
  version_source:
    type: image
    image: freshrss
build:
  run_buildscript: false
images:
- id: freshrss
  target: service
  service: freshrss
  source: freshrss/freshrss
  channel: stable
  sort: semver
  tag_regex: ^v?\d+\.\d+\.\d+$
  delivery:
    mode: mirror
    require_digest_match: true
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: FreshRSS
    summary: 自托管 RSS 阅读与聚合服务
